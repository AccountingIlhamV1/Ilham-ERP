<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Transaksi - Ilham ERP</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 15px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 15px;
      background: #222;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .save-button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      font-size: 16px;
    }

    .danger {
      background: #c62828;
    }

    .status {
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .success {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .warning {
      background: #fff3cd;
      color: #856404;
    }

    .error {
      background: #ffebee;
      color: #b71c1c;
    }

    .preview {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      background: #f1f3f5;
    }

    .preview-row {
      padding: 7px 0;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 11px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f1f3f5;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .amount {
      text-align: right;
      white-space: nowrap;
    }
  </style>
</head>

<body>

<div class="container">

  <a href="index.html" class="back">
    ← Kembali ke Dashboard
  </a>

  <h1>🧾 Transaksi</h1>

  <div class="subtitle">
    Ilham ERP — Input Transaksi
  </div>


  <div id="status"></div>


  <!-- =========================================
       FORM TRANSAKSI
       ========================================= -->

  <div class="card">

    <h2>Input Transaksi</h2>

    <label for="date">
      Tanggal
    </label>

    <input
      type="date"
      id="date"
    >


    <label for="amount">
      Nominal Transaksi
    </label>

    <input
      type="number"
      id="amount"
      min="0"
      placeholder="Contoh: 20000000"
    >


    <label for="description">
      Keterangan Transaksi
    </label>

    <textarea
      id="description"
      placeholder="Contoh: Membeli mesin secara tunai"
    ></textarea>


    <!-- AKUN DEBIT -->

    <label for="debitAccount">
      Akun Debit
    </label>

    <select id="debitAccount">

      <option value="">
        -- Pilih Akun Debit --
      </option>

    </select>


    <!-- AKUN KREDIT -->

    <label for="creditAccount">
      Akun Kredit
    </label>

    <select id="creditAccount">

      <option value="">
        -- Pilih Akun Kredit --
      </option>

    </select>


    <!-- PREVIEW -->

    <div class="preview">

      <strong>
        Preview Jurnal
      </strong>

      <div class="preview-row">
        Debit:
        <span id="previewDebit">
          -
        </span>
      </div>

      <div class="preview-row">
        Kredit:
        <span id="previewCredit">
          -
        </span>
      </div>

      <div class="preview-row">
        Nominal:
        <span id="previewAmount">
          Rp0
        </span>
      </div>

    </div>


    <button
      class="save-button"
      onclick="saveTransaction()"
    >
      + SIMPAN TRANSAKSI
    </button>

  </div>


  <!-- =========================================
       DAFTAR TRANSAKSI
       ========================================= -->

  <div class="card">

    <h2>
      Daftar Transaksi
    </h2>

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
            <th>No</th>
            <th>Tanggal</th>
            <th>Keterangan</th>
            <th>Debit</th>
            <th>Kredit</th>
            <th>Nominal</th>
            <th>Aksi</th>
          </tr>

        </thead>

        <tbody id="transactionTable"></tbody>

      </table>

    </div>

  </div>

</div>


<script>

/* =================================================
   DATABASE COA PUSAT
   ================================================= */

const ACCOUNT_STORAGE_KEY =
  "ilhamERP_accounts";


/* =================================================
   DATABASE TRANSAKSI
   ================================================= */

const TRANSACTION_STORAGE_KEY =
  "ilhamERP_transactions";


/* =================================================
   AMBIL COA
   ================================================= */

function getAccounts() {

  try {

    const data =
      localStorage.getItem(
        ACCOUNT_STORAGE_KEY
      );

    if (!data) {
      return [];
    }

    const parsed =
      JSON.parse(data);

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch (error) {

    console.error(
      "Gagal membaca COA:",
      error
    );

    return [];

  }

}


/* =================================================
   AMBIL TRANSAKSI
   ================================================= */

function getTransactions() {

  try {

    const data =
      localStorage.getItem(
        TRANSACTION_STORAGE_KEY
      );

    if (!data) {
      return [];
    }

    const parsed =
      JSON.parse(data);

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch (error) {

    console.error(
      "Gagal membaca transaksi:",
      error
    );

    return [];

  }

}


let transactions =
  getTransactions();


/* =================================================
   FORMAT RUPIAH
   ================================================= */

function formatRupiah(number) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(number);

}


/* =================================================
   ISI DROPDOWN DARI COA
   ================================================= */

function loadAccounts() {

  const accounts =
    getAccounts();


  const debitSelect =
    document.getElementById(
      "debitAccount"
    );

  const creditSelect =
    document.getElementById(
      "creditAccount"
    );


  debitSelect.innerHTML = `
    <option value="">
      -- Pilih Akun Debit --
    </option>
  `;


  creditSelect.innerHTML = `
    <option value="">
      -- Pilih Akun Kredit --
    </option>
  `;


  /* ---------------------------------------------
     CEK COA
     --------------------------------------------- */

  if (accounts.length === 0) {

    showStatus(
      "⚠️ COA belum memiliki akun. " +
      "Silakan tambahkan akun melalui Chart of Accounts.",
      "warning"
    );

    return;

  }


  /* ---------------------------------------------
     MASUKKAN SEMUA AKUN
     --------------------------------------------- */

  accounts.forEach(account => {

    const code =
      String(
        account.code || ""
      );

    const name =
      String(
        account.name || ""
      );

    const group =
      String(
        account.group || ""
      );

    const normal =
      String(
        account.normalBalance || ""
      );


    if (!code || !name) {
      return;
    }


    const text =
      code +
      " - " +
      name +
      " | " +
      group +
      " | Normal " +
      normal;


    /* DEBIT */

    const debitOption =
      document.createElement(
        "option"
      );

    debitOption.value =
      code;

    debitOption.textContent =
      text;

    debitSelect.appendChild(
      debitOption
    );


    /* KREDIT */

    const creditOption =
      document.createElement(
        "option"
      );

    creditOption.value =
      code;

    creditOption.textContent =
      text;

    creditSelect.appendChild(
      creditOption
    );

  });


  showStatus(
    "✅ " +
    accounts.length +
    " akun COA berhasil dimuat otomatis.",
    "success"
  );

}


/* =================================================
   PREVIEW JURNAL
   ================================================= */

function updatePreview() {

  const accounts =
    getAccounts();


  const debitCode =
    document.getElementById(
      "debitAccount"
    ).value;


  const creditCode =
    document.getElementById(
      "creditAccount"
    ).value;


  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    ) || 0;


  const debit =
    accounts.find(
      account =>
        String(account.code) ===
        String(debitCode)
    );


  const credit =
    accounts.find(
      account =>
        String(account.code) ===
        String(creditCode)
    );


  document.getElementById(
    "previewDebit"
  ).textContent =
    debit
      ? debit.code +
        " - " +
        debit.name
      : "-";


  document.getElementById(
    "previewCredit"
  ).textContent =
    credit
      ? credit.code +
        " - " +
        credit.name
      : "-";


  document.getElementById(
    "previewAmount"
  ).textContent =
    formatRupiah(amount);

}


/* =================================================
   SIMPAN TRANSAKSI
   ================================================= */

function saveTransaction() {

  const accounts =
    getAccounts();


  const date =
    document.getElementById(
      "date"
    ).value;


  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );


  const description =
    document.getElementById(
      "description"
    ).value.trim();


  const debitCode =
    document.getElementById(
      "debitAccount"
    ).value;


  const creditCode =
    document.getElementById(
      "creditAccount"
    ).value;


  /* VALIDASI */

  if (!date) {

    alert(
      "Tanggal belum dipilih."
    );

    return;

  }


  if (
    !amount ||
    amount <= 0
  ) {

    alert(
      "Nominal harus lebih dari 0."
    );

    return;

  }


  if (!description) {

    alert(
      "Keterangan transaksi belum diisi."
    );

    return;

  }


  if (!debitCode) {

    alert(
      "Silakan pilih akun Debit."
    );

    return;

  }


  if (!creditCode) {

    alert(
      "Silakan pilih akun Kredit."
    );

    return;

  }


  if (
    debitCode ===
    creditCode
  ) {

    alert(
      "Akun Debit dan Kredit tidak boleh sama."
    );

    return;

  }


  /* CARI AKUN */

  const debit =
    accounts.find(
      account =>
        String(account.code) ===
        String(debitCode)
    );


  const credit =
    accounts.find(
      account =>
        String(account.code) ===
        String(creditCode)
    );


  if (!debit || !credit) {

    alert(
      "Akun tidak ditemukan di COA."
    );

    return;

  }


  /* BUAT TRANSAKSI */

  const transaction = {

    id: Date.now(),

    date: date,

    description: description,

    amount: amount,

    debitCode: debit.code,

    debitName: debit.name,

    debitGroup: debit.group,

    creditCode: credit.code,

    creditName: credit.name,

    creditGroup: credit.group

  };


  /* AMBIL DATA TERBARU */

  transactions =
    getTransactions();


  transactions.push(
    transaction
  );


  /* SIMPAN */

  localStorage.setItem(

    TRANSACTION_STORAGE_KEY,

    JSON.stringify(
      transactions
    )

  );


  alert(
    "✅ Transaksi berhasil disimpan."
  );


  /* RESET */

  document.getElementById(
    "amount"
  ).value = "";


  document.getElementById(
    "description"
  ).value = "";


  document.getElementById(
    "debitAccount"
  ).value = "";


  document.getElementById(
    "creditAccount"
  ).value = "";


  updatePreview();

  renderTransactions();

}


/* =================================================
   TAMPILKAN TRANSAKSI
   ================================================= */

function renderTransactions() {

  transactions =
    getTransactions();


  const table =
    document.getElementById(
      "transactionTable"
    );


  table.innerHTML = "";


  if (
    transactions.length === 0
  ) {

    table.innerHTML = `
      <tr>
        <td
          colspan="7"
          class="empty"
        >
          Belum ada transaksi.
        </td>
      </tr>
    `;

    return;

  }


  transactions.forEach(
    (transaction, index) => {

      table.innerHTML += `

        <tr>

          <td>
            ${index + 1}
          </td>

          <td>
            ${transaction.date || "-"}
          </td>

          <td>
            ${transaction.description || "-"}
          </td>

          <td>
            ${transaction.debitCode || ""}
            -
            ${transaction.debitName || ""}
          </td>

          <td>
            ${transaction.creditCode || ""}
            -
            ${transaction.creditName || ""}
          </td>

          <td class="amount">
            ${formatRupiah(
              Number(transaction.amount) || 0
            )}
          </td>

          <td>

            <button
              class="danger"
              onclick="
                deleteTransaction(${index})
              "
            >
              Hapus
            </button>

          </td>

        </tr>

      `;

    }
  );

}


/* =================================================
   HAPUS TRANSAKSI
   ================================================= */

function deleteTransaction(index) {

  transactions =
    getTransactions();


  if (
    !transactions[index]
  ) {
    return;
  }


  const confirmDelete =
    confirm(
      "Hapus transaksi ini?"
    );


  if (!confirmDelete) {
    return;
  }


  transactions.splice(
    index,
    1
  );


  localStorage.setItem(

    TRANSACTION_STORAGE_KEY,

    JSON.stringify(
      transactions
    )

  );


  renderTransactions();

}


/* =================================================
   STATUS
   ================================================= */

function showStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML = `
    <div class="status ${type}">
      ${message}
    </div>
  `;


  setTimeout(
    () => {
      status.innerHTML = "";
    },
    4000
  );

}


/* =================================================
   EVENT
   ================================================= */

document
  .getElementById(
    "debitAccount"
  )
  .addEventListener(
    "change",
    updatePreview
  );


document
  .getElementById(
    "creditAccount"
  )
  .addEventListener(
    "change",
    updatePreview
  );


document
  .getElementById(
    "amount"
  )
  .addEventListener(
    "input",
    updatePreview
  );


/* =================================================
   JALANKAN
   ================================================= */

loadAccounts();

renderTransactions();

</script>

</body>
  </html>
