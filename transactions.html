<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transaksi - Ilham ERP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .header {
            background: #111827;
            color: white;
            padding: 22px 20px;
        }

        .container {
            width: 94%;
            max-width: 1100px;
            margin: auto;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .header p {
            margin: 7px 0 0;
            color: #d1d5db;
        }

        .back {
            display: inline-block;
            margin: 25px 0 15px;
            color: #374151;
            text-decoration: none;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .full {
            grid-column: 1 / -1;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f3f4f6;
        }

        .delete-btn {
            width: auto;
            margin: 0;
            padding: 7px 10px;
            background: #dc2626;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        .info {
            background: #eff6ff;
            padding: 15px;
            border-radius: 10px;
            color: #1e40af;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .journal-preview {
            margin-top: 20px;
            padding: 18px;
            background: #f9fafb;
            border-radius: 10px;
            display: none;
        }

        .journal-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .debit {
            color: #166534;
            font-weight: bold;
        }

        .credit {
            color: #1d4ed8;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <div class="container">

            <h1>🧾 Input Transaksi</h1>

            <p>
                Ilham ERP — Accounting Learning System
            </p>

        </div>

    </div>


    <div class="container">

        <a href="index.html" class="back">
            ← Kembali ke Dashboard
        </a>


        <!-- FORM TRANSAKSI -->

        <div class="card">

            <h2>Tambah Transaksi</h2>

            <div class="info">

                Masukkan transaksi perusahaan.
                Sistem akan menyimpan transaksi dan
                membentuk jurnal debit-kredit secara otomatis.

            </div>


            <div class="form-grid">


                <!-- TANGGAL -->

                <div>

                    <label for="transactionDate">
                        Tanggal
                    </label>

                    <input
                        type="date"
                        id="transactionDate"
                    >

                </div>


                <!-- NOMINAL -->

                <div>

                    <label for="amount">
                        Nominal Transaksi
                    </label>

                    <input
                        type="number"
                        id="amount"
                        min="0"
                        placeholder="Contoh: 20000000"
                    >

                </div>


                <!-- KETERANGAN -->

                <div class="full">

                    <label for="description">
                        Keterangan Transaksi
                    </label>

                    <textarea
                        id="description"
                        placeholder="Contoh: Membeli peralatan secara tunai"
                    ></textarea>

                </div>


                <!-- AKUN DEBIT -->

                <div>

                    <label for="debitAccount">
                        Akun Debit
                    </label>

                    <select id="debitAccount">

                        <option value="">
                            -- Pilih Akun Debit --
                        </option>

                    </select>

                </div>


                <!-- AKUN KREDIT -->

                <div>

                    <label for="creditAccount">
                        Akun Kredit
                    </label>

                    <select id="creditAccount">

                        <option value="">
                            -- Pilih Akun Kredit --
                        </option>

                    </select>

                </div>

            </div>


            <!-- PREVIEW -->

            <div
                class="journal-preview"
                id="journalPreview"
            >

                <strong>
                    Preview Jurnal
                </strong>

                <div
                    class="journal-row"
                    id="previewDebit"
                ></div>

                <div
                    class="journal-row"
                    id="previewCredit"
                ></div>

            </div>


            <button onclick="saveTransaction()">

                + SIMPAN TRANSAKSI

            </button>

        </div>


        <!-- DAFTAR TRANSAKSI -->

        <div class="card">

            <h2>
                Daftar Transaksi
            </h2>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                No
                            </th>

                            <th>
                                Tanggal
                            </th>

                            <th>
                                Keterangan
                            </th>

                            <th>
                                Debit
                            </th>

                            <th>
                                Kredit
                            </th>

                            <th>
                                Nominal
                            </th>

                            <th>
                                Aksi
                            </th>

                        </tr>

                    </thead>

                    <tbody id="transactionTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

            currency: "IDR",

}
