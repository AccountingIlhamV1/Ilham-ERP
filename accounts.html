<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chart of Accounts - Ilham ERP</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 15px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 15px;
      background: #222;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .save-button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.85;
    }

    .danger {
      background: #c62828;
    }

    .success {
      background: #e8f5e9;
      color: #1b5e20;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .info {
      background: #e3f2fd;
      color: #0d47a1;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th,
    td {
      padding: 11px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f1f3f5;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .debit {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .credit {
      background: #ffebee;
      color: #b71c1c;
    }
  </style>
</head>

<body>

<div class="container">

  <a href="index.html" class="back">
    ← Kembali ke Dashboard
  </a>

  <h1>📋 Chart of Accounts</h1>

  <div class="subtitle">
    Ilham ERP — Pusat Data Akun
  </div>


  <!-- STATUS -->

  <div id="status"></div>


  <!-- FORM TAMBAH AKUN -->

  <div class="card">

    <h2>Tambah Akun</h2>

    <div class="info">
      💡 Setiap akun yang ditambahkan di sini akan otomatis
      tersedia di modul Transaksi, Jurnal Umum, Buku Besar,
      dan Neraca Saldo.
    </div>


    <label>Kode Akun</label>

    <input
      type="text"
      id="code"
      placeholder="Contoh: 1101"
    >


    <label>Nama Akun</label>

    <input
      type="text"
      id="name"
      placeholder="Contoh: Kas"
    >


    <label>Kelompok Akun</label>

    <select id="group">

      <option value="">
        -- Pilih Kelompok Akun --
      </option>

      <option value="Aset Lancar">
        Aset Lancar
      </option>

      <option value="Aset Tetap">
        Aset Tetap
      </option>

      <option value="Aset Lainnya">
        Aset Lainnya
      </option>

      <option value="Liabilitas Jangka Pendek">
        Liabilitas Jangka Pendek
      </option>

      <option value="Liabilitas Jangka Panjang">
        Liabilitas Jangka Panjang
      </option>

      <option value="Ekuitas">
        Ekuitas
      </option>

      <option value="Pendapatan">
        Pendapatan
      </option>

      <option value="Beban">
        Beban
      </option>

    </select>


    <label>Saldo Normal</label>

    <select id="normalBalance">

      <option value="">
        -- Pilih Saldo Normal --
      </option>

      <option value="Debit">
        Debit
      </option>

      <option value="Kredit">
        Kredit
      </option>

    </select>


    <button
      class="save-button"
      onclick="addAccount()"
    >
      + TAMBAH AKUN
    </button>

  </div>


  <!-- DAFTAR AKUN -->

  <div class="card">

    <h2>Daftar Akun</h2>

    <div class="table-wrapper">

      <table>

        <thead>

          <tr>
            <th>No</th>
            <th>Kode</th>
            <th>Nama Akun</th>
            <th>Kelompok</th>
            <th>Saldo Normal</th>
            <th>Aksi</th>
          </tr>

        </thead>

        <tbody id="accountTable"></tbody>

      </table>

    </div>

  </div>

</div>


<script>

  // ==================================================
  // DATABASE COA
  // ==================================================

  const STORAGE_KEY = "ilhamERP_accounts";


  let accounts =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    ) || [];


  // ==================================================
  // SIMPAN COA
  // ==================================================

  function saveAccounts() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(accounts)
    );

  }


  // ==================================================
  // FORMAT / BERSIHKAN KODE
  // ==================================================

  function cleanCode(code) {

    return String(code)
      .trim()
      .replace(/\s+/g, "");

  }


  // ==================================================
  // TAMBAH AKUN
  // ==================================================

  function addAccount() {

    const code =
      cleanCode(
        document.getElementById("code").value
      );

    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const group =
      document.getElementById("group").value;

    const normalBalance =
      document.getElementById("normalBalance").value;


    // -----------------------------------------------
    // VALIDASI
    // -----------------------------------------------

    if (!code) {
      alert("Kode akun belum diisi.");
      return;
    }

    if (!name) {
      alert("Nama akun belum diisi.");
      return;
    }

    if (!group) {
      alert("Pilih kelompok akun.");
      return;
    }

    if (!normalBalance) {
      alert("Pilih saldo normal Debit atau Kredit.");
      return;
    }


    // -----------------------------------------------
    // CEK KODE DUPLIKAT
    // -----------------------------------------------

    const duplicate =
      accounts.some(
        account =>
          String(account.code) === code
      );


    if (duplicate) {

      alert(
        "Kode akun " +
        code +
        " sudah digunakan."
      );

      return;

    }


    // -----------------------------------------------
    // BUAT AKUN
    // -----------------------------------------------

    const newAccount = {

      id: Date.now(),

      code: code,

      name: name,

      group: group,

      normalBalance: normalBalance

    };


    accounts.push(newAccount);


    // -----------------------------------------------
    // URUTKAN BERDASARKAN KODE
    // -----------------------------------------------

    accounts.sort(
      (a, b) =>
        String(a.code).localeCompare(
          String(b.code),
          undefined,
          {
            numeric: true
          }
        )
    );


    // -----------------------------------------------
    // SIMPAN KE DATABASE LOCAL
    // -----------------------------------------------

    saveAccounts();


    // -----------------------------------------------
    // RESET FORM
    // -----------------------------------------------

    document.getElementById("code").value = "";

    document.getElementById("name").value = "";

    document.getElementById("group").value = "";

    document.getElementById("normalBalance").value = "";


    showStatus(
      "✅ Akun " +
      code +
      " - " +
      name +
      " berhasil ditambahkan."
    );


    renderAccounts();

  }


  // ==================================================
  // HAPUS AKUN
  // ==================================================

  function deleteAccount(id) {

    const account =
      accounts.find(
        item => item.id === id
      );


    if (!account) {
      return;
    }


    const confirmDelete =
      confirm(
        "Hapus akun " +
        account.code +
        " - " +
        account.name +
        "?"
      );


    if (!confirmDelete) {
      return;
    }


    accounts =
      accounts.filter(
        item => item.id !== id
      );


    saveAccounts();

    renderAccounts();


    showStatus(
      "✅ Akun berhasil dihapus."
    );

  }


  // ==================================================
  // TAMPILKAN STATUS
  // ==================================================

  function showStatus(message) {

    document.getElementById("status").innerHTML = `
      <div class="success">
        ${message}
      </div>
    `;


    setTimeout(() => {

      document.getElementById("status").innerHTML = "";

    }, 3000);

  }


  // ==================================================
  // TAMPILKAN COA
  // ==================================================

  function renderAccounts() {

    const table =
      document.getElementById("accountTable");


    table.innerHTML = "";


    if (accounts.length === 0) {

      table.innerHTML = `
        <tr>
          <td
            colspan="6"
            class="empty"
          >
            Belum ada akun.
          </td>
        </tr>
      `;

      return;

    }


    accounts.forEach(
      (account, index) => {

        const badgeClass =
          account.normalBalance === "Debit"
            ? "debit"
            : "credit";


        table.innerHTML += `

          <tr>

            <td>
              ${index + 1}
            </td>

            <td>
              <strong>
                ${account.code}
              </strong>
            </td>

            <td>
              ${account.name}
            </td>

            <td>
              ${account.group}
            </td>

            <td>

              <span
                class="badge ${badgeClass}"
              >
                ${account.normalBalance}
              </span>

            </td>

            <td>

              <button
                class="danger"
                onclick="deleteAccount(${account.id})"
              >
                Hapus
              </button>

            </td>

          </tr>

        `;

      }
    );

  }


  // ==================================================
  // JALANKAN
  // ==================================================

  renderAccounts();

</script>

</body>
    </html>
